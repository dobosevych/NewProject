AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Meetings app - container registry for the backend image. Deployed before
  backend.yaml, because the image must be pushed before the ECS service can start.

Parameters:
  AppName:
    Type: String
    Default: meetings
    AllowedPattern: "[a-z][a-z0-9-]*"

Resources:
  BackendRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub ${AppName}-backend
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep the 3 most recent images (free tier: 500 MB)",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 3
                },
                "action": { "type": "expire" }
              }
            ]
          }

Outputs:
  RepositoryUri:
    Value: !GetAtt BackendRepository.RepositoryUri
