AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Meetings app - backend API on AWS Lambda (container image + Lambda Web Adapter) and its
  PostgreSQL database on RDS, sized for the AWS Free Tier. The function runs in the
  database's private subnets and needs no internet access, so there is no NAT gateway.
  The database and the backend are created together.

Parameters:
  AppName:
    Type: String
    Default: meetings
    AllowedPattern: "[a-z][a-z0-9-]*"
  ImageUri:
    Type: String
    Description: Full backend image URI including tag (pushed by `make deploy-backend`).
  DBPassword:
    Type: String
    NoEcho: true
    Description: >-
      Same value as the /<AppName>/db-password SecureString; passed in by the deploy script
      because Lambda environment variables cannot resolve SecureString references.
  CorsOrigins:
    Type: String
    Default: http://localhost:5173
    Description: Comma-separated origins allowed to call the API directly (not needed via CloudFront).
  MemorySize:
    Type: Number
    Default: 512
    Description: Lambda memory in MB (CPU scales with it).
  DBInstanceClass:
    Type: String
    Default: db.t4g.micro
  DBName:
    Type: String
    Default: meetings
    AllowedPattern: "[a-zA-Z][a-zA-Z0-9_]*"
  DBUser:
    Type: String
    Default: meetings
    AllowedPattern: "[a-zA-Z][a-zA-Z0-9_]*"

Resources:
  # ---------------------------------------------------------------- Network
  # Private subnets only: the function talks to nothing but the database.
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - { Key: Name, Value: !Ref AppName }

  # Two availability zones: required by RDS subnet groups, and keeps Lambda highly available.
  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.10.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - { Key: Name, Value: !Sub "${AppName}-private-a" }

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.11.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags:
        - { Key: Name, Value: !Sub "${AppName}-private-b" }

  # --------------------------------------------------------- Security groups
  FunctionSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Backend Lambda function (outbound only)
      VpcId: !Ref Vpc

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL, reachable only from the backend function
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref FunctionSecurityGroup

  # ---------------------------------------------------------------- Database
  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnets for the backend database
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub ${AppName}-db
      Engine: postgres
      EngineVersion: "17.11"
      DBInstanceClass: !Ref DBInstanceClass
      # Free tier: 20 GB of General Purpose (gp2) storage, single-AZ.
      AllocatedStorage: "20"
      StorageType: gp2
      StorageEncrypted: true
      DBName: !Ref DBName
      MasterUsername: !Ref DBUser
      # SecureString created by infra/deploy-backend.sh (CloudFormation cannot create one).
      MasterUserPassword: !Sub "{{resolve:ssm-secure:/${AppName}/db-password}}"
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VPCSecurityGroups: [!Ref DatabaseSecurityGroup]
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 1
      # Snapshots (including the final one on delete) keep the App tag.
      CopyTagsToSnapshot: true
      EnablePerformanceInsights: false
      AutoMinorVersionUpgrade: true

  # ------------------------------------------------------------------ Backend
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /${AppName}/backend
      RetentionInDays: 7

  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # Network interfaces in the VPC + CloudWatch Logs.
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole

  Function:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AppName}-backend
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      Architectures: [arm64]
      MemorySize: !Ref MemorySize
      # Covers a cold start: migrations check + app startup.
      Timeout: 30
      Role: !GetAtt FunctionRole.Arn
      VpcConfig:
        SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
        SecurityGroupIds: [!Ref FunctionSecurityGroup]
      LoggingConfig:
        LogGroup: !Ref LogGroup
      Environment:
        Variables:
          DATABASE_URL: !Sub postgresql+asyncpg://${DBUser}:${DBPassword}@${Database.Endpoint.Address}:${Database.Endpoint.Port}/${DBName}
          CORS_ORIGINS: !Ref CorsOrigins
          # One request per instance at a time; keeps RDS connections low as Lambda scales out.
          DB_POOL_SIZE: "1"
          DB_MAX_OVERFLOW: "1"
          # Lambda Web Adapter: forward requests to uvicorn once /api/health answers.
          AWS_LWA_PORT: "8000"
          AWS_LWA_READINESS_CHECK_PATH: /api/health
          AWS_LWA_ASYNC_INIT: "true"

  FunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt Function.Arn
      AuthType: NONE

  # A public function URL needs both permissions.
  FunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  FunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

Outputs:
  ApiUrl:
    Description: Base URL of the API (direct, without CloudFront)
    Value: !Sub
      - https://${Domain}/api
      - Domain: !Select [2, !Split ["/", !GetAtt FunctionUrl.FunctionUrl]]
  DocsUrl:
    Value: !Sub
      - https://${Domain}/api/docs
      - Domain: !Select [2, !Split ["/", !GetAtt FunctionUrl.FunctionUrl]]
  ApiDomain:
    Description: Function URL host name, used as the CloudFront /api/* origin
    Value: !Select [2, !Split ["/", !GetAtt FunctionUrl.FunctionUrl]]
  FunctionName:
    Value: !Ref Function
  DatabaseEndpoint:
    Value: !GetAtt Database.Endpoint.Address
  LogGroup:
    Value: !Ref LogGroup
