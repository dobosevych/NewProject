AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Meetings app - backend API and its PostgreSQL database, sized for the AWS Free Tier:
  one EC2 instance running the backend container, one RDS micro instance, no load
  balancer and no NAT gateway. The database and the backend are created together.

Parameters:
  AppName:
    Type: String
    Default: meetings
    AllowedPattern: "[a-z][a-z0-9-]*"
  ImageUri:
    Type: String
    Description: Full backend image URI including tag (pushed by `make deploy-backend`).
  CorsOrigins:
    Type: String
    Default: http://localhost:5173
    Description: Comma-separated origins allowed to call the API (e.g. the deployed frontend).
  InstanceType:
    Type: String
    Default: t3.micro
    Description: >-
      Free-tier eligible types depend on the account; t3.micro on the current free plan,
      t2.micro on legacy 12-month free tier accounts in most regions.
  ImageId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  DBInstanceClass:
    Type: String
    Default: db.t4g.micro
  DBName:
    Type: String
    Default: meetings
    AllowedPattern: "[a-zA-Z][a-zA-Z0-9_]*"
  DBUser:
    Type: String
    Default: meetings
    AllowedPattern: "[a-zA-Z][a-zA-Z0-9_]*"

Resources:
  # ---------------------------------------------------------------- Network
  # The instance sits in a public subnet so it can reach ECR without a NAT gateway.
  # The database sits in private subnets with no route to the internet.
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - { Key: Name, Value: !Ref AppName }

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.0.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      # The first-boot script needs internet before the Elastic IP is attached.
      MapPublicIpOnLaunch: true
      Tags:
        - { Key: Name, Value: !Sub "${AppName}-public" }

  # RDS requires a subnet group spanning two availability zones.
  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.10.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - { Key: Name, Value: !Sub "${AppName}-private-a" }

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.11.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags:
        - { Key: Name, Value: !Sub "${AppName}-private-b" }

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  # --------------------------------------------------------- Security groups
  BackendSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTP to the backend. No SSH; use SSM Session Manager.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL, reachable only from the backend instance
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref BackendSecurityGroup

  # ---------------------------------------------------------------- Database
  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnets for the backend database
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub ${AppName}-db
      Engine: postgres
      EngineVersion: "17.11"
      DBInstanceClass: !Ref DBInstanceClass
      # Free tier: 20 GB of General Purpose (gp2) storage, single-AZ.
      AllocatedStorage: "20"
      StorageType: gp2
      StorageEncrypted: true
      DBName: !Ref DBName
      MasterUsername: !Ref DBUser
      # SecureString created by infra/deploy-backend.sh (CloudFormation cannot create one).
      MasterUserPassword: !Sub "{{resolve:ssm-secure:/${AppName}/db-password}}"
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VPCSecurityGroups: [!Ref DatabaseSecurityGroup]
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 1
      EnablePerformanceInsights: false
      AutoMinorVersionUpgrade: true

  # ------------------------------------------------------------------ Backend
  # Everything that changes between deploys lives here, so the instance's user
  # data (which only runs on first boot) never has to change.
  BackendConfig:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${AppName}/backend-config
      Type: String
      Value: !Sub |
        IMAGE=${ImageUri}
        DB_HOST=${Database.Endpoint.Address}
        DB_PORT=${Database.Endpoint.Port}
        DB_NAME=${DBName}
        DB_USER=${DBUser}
        CORS_ORIGINS=${CorsOrigins}

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /${AppName}/backend
      RetentionInDays: 7

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
      Policies:
        - PolicyName: backend-runtime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AppName}/backend-config
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AppName}/db-password
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt LogGroup.Arn

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  Instance:
    Type: AWS::EC2::Instance
    DependsOn: [PublicDefaultRoute, BackendConfig]
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds: [!Ref BackendSecurityGroup]
      MetadataOptions:
        HttpTokens: required
      Tags:
        - { Key: Name, Value: !Sub "${AppName}-backend" }
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          dnf install -y docker
          systemctl enable --now docker

          # 1 GB of RAM is tight; swap keeps migrations and pulls from being OOM-killed.
          fallocate -l 1G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
          echo '/swapfile none swap defaults 0 0' >> /etc/fstab

          mkdir -p /opt/app
          cat > /opt/app/run.sh <<'EOF'
          #!/bin/bash
          # (Re)starts the backend container from the config in SSM. Run on every deploy.
          set -euo pipefail
          export AWS_DEFAULT_REGION=${AWS::Region}
          aws ssm get-parameter --name /${AppName}/backend-config \
            --query Parameter.Value --output text > /opt/app/config.env
          set -a; . /opt/app/config.env; set +a
          DB_PASSWORD=$(aws ssm get-parameter --name /${AppName}/db-password --with-decryption \
            --query Parameter.Value --output text)

          aws ecr get-login-password | docker login --username AWS --password-stdin "${!IMAGE%%/*}"
          docker pull "$IMAGE"
          docker rm -f backend 2>/dev/null || true
          docker run -d --name backend --restart unless-stopped -p 80:8000 \
            -e DATABASE_URL="postgresql+asyncpg://$DB_USER:$DB_PASSWORD@$DB_HOST:$DB_PORT/$DB_NAME" \
            -e CORS_ORIGINS="$CORS_ORIGINS" \
            --log-driver awslogs \
            --log-opt awslogs-region=${AWS::Region} \
            --log-opt awslogs-group=${LogGroup} \
            --log-opt awslogs-stream=backend \
            "$IMAGE"
          docker image prune -af >/dev/null
          EOF
          chmod +x /opt/app/run.sh
          /opt/app/run.sh

  PublicIp:
    Type: AWS::EC2::EIP
    DependsOn: GatewayAttachment
    Properties:
      Domain: vpc
      InstanceId: !Ref Instance

Outputs:
  ApiUrl:
    Description: Base URL of the API
    Value: !Sub http://${PublicIp}/api
  DocsUrl:
    Value: !Sub http://${PublicIp}/api/docs
  InstanceId:
    Value: !Ref Instance
  DatabaseEndpoint:
    Value: !GetAtt Database.Endpoint.Address
  LogGroup:
    Value: !Ref LogGroup
